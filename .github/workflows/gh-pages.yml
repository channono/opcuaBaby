name: Deploy Docs (MkDocs)

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/gh-pages.yml'
  workflow_dispatch: {}

# Required for GitHub Pages (Actions) deployment flow
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs and plugins
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs mkdocs-material

      - name: Sync README and assets into docs
        run: |
          set -e
          mkdir -p docs
          # Always use README as the site homepage (no extra title to avoid duplicate H1)
          cp README.md docs/index.md
          # Fix README links for site context
          # - Docs link should not point to ./docs/index.md inside the site
          sed -i.bak 's#](./docs/index.md)#](./index.md)#g' docs/index.md && rm -f docs/index.md.bak
          # Add stable anchors for language sections and rewrite language nav to use them
          # Insert English anchor at top
          sed -i.bak '1s|^|<a id="en"></a>\n|; s#](#opcuaBaby)#](#en)#' docs/index.md || true
          rm -f docs/index.md.bak
          # Ensure Chinese and Japanese headings have explicit IDs
          sed -i.bak -E 's/^## 简体中文\s*$/## 简体中文 {#zh}/' docs/index.md
          sed -i.bak -E 's/^## 日本語\s*$/## 日本語 {#ja}/' docs/index.md
          # Rewrite the top language links to new anchors
          sed -i.bak 's#](#简体中文)#](#zh)#; s#](#日本語)#](#ja)#' docs/index.md
          rm -f docs/index.md.bak
          if [ -d assets ]; then
            rm -rf docs/assets
            cp -R assets docs/assets
          fi

      - name: Build site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps: 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
